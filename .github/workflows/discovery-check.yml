name: Discovery dashboard checks
on:
  pull_request:
    paths:
      - 'discovery/**'
      - 'data/discovery/**'
      - 'tests/discovery-check.cjs'
      - '.github/workflows/discovery-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/discovery-check.cjs
