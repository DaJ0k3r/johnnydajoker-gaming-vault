name: MADHOUSE Generate Responsive Art (temporary)
on:
  push:
    branches: [homepage-fast-art-2026-11]
    paths: ['scripts/build_art_webp.py', '.github/workflows/generate-art-once.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homepage-fast-art-2026-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for loss-minimising encoding
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate optimized desktop and mobile artwork from original PNGs
        run: python scripts/build_art_webp.py
      - name: Commit generated WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-*.webp assets/nfsu2-*.webp assets/carbon-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Encode smaller high-quality mobile/desktop MADHOUSE artwork"
            git push origin HEAD:homepage-fast-art-2026-11
          fi
