name: MADHOUSE Optimize Hero Art (temporary)
on:
  push:
    branches: [perf-joker-hero-webp-2026-11]
    paths: ['.github/workflows/optimize-art-once.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-joker-hero-webp-2026-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create responsive high-quality WebP artwork without altering originals
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          jobs = [
              ("JohnnyDaJoker_YouTube_Banner_2560x1440.png","JohnnyDaJoker_Hero",[(1600,83),(960,81)]),
              ("file_000000007d00821198a25c70975fa763.png","NFS_Underground2",[(1600,84),(960,82)]),
              ("file_0000000034dc8211871698b8baa78445.png","NFS_Carbon",[(1600,84),(960,82)]),
          ]
          for original,stem,sizes in jobs:
              with Image.open(original) as img:
                  img = ImageOps.exif_transpose(img).convert("RGB")
                  for width,quality in sizes:
                      target_width = min(width, img.width)
                      resized = img.resize((target_width, round(img.height*target_width/img.width)),Image.Resampling.LANCZOS)
                      out = Path(f"{stem}_{width}.webp")
                      resized.save(out,"WEBP",quality=quality,method=6)
                      print(original,"=>",out, "bytes:",out.stat().st_size)
                      assert out.stat().st_size < 1_500_000, f"{out} unexpectedly large"
          PY
      - name: Commit optimized variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JohnnyDaJoker_Hero_*.webp NFS_Underground2_*.webp NFS_Carbon_*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add responsive WebP Joker and racing artwork while retaining source images"
            git push origin HEAD:perf-joker-hero-webp-2026-11
          fi
