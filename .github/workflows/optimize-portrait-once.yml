name: MADHOUSE Optimize Portrait (temporary)
on:
  push:
    branches: [mobile-intro-first-return-2026-11]
    paths: ['.github/workflows/optimize-portrait-once.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-intro-first-return-2026-11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate responsive Joker portrait with alpha preserved
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          with Image.open('JohnnyDaJoker.png') as source:
              source = ImageOps.exif_transpose(source)
              image = source.convert('RGBA' if source.mode in ('P','RGBA','LA') or 'transparency' in source.info else 'RGB')
              print('Original', image.size, image.mode)
              for limit, quality in ((960, 83), (600, 80)):
                  ratio = min(1, limit/max(image.size))
                  res = image.resize((round(image.width*ratio),round(image.height*ratio)), Image.Resampling.LANCZOS)
                  name=Path(f'JohnnyDaJoker_Portrait_{limit}.webp')
                  res.save(name,'WEBP', quality=quality, method=6)
                  print(name, res.size, name.stat().st_size)
                  assert name.stat().st_size < 400000
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JohnnyDaJoker_Portrait_*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add responsive compressed Joker portrait artwork"
            git push origin HEAD:mobile-intro-first-return-2026-11
          fi
