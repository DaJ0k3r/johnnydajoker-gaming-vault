name: MADHOUSE Generate SEO Pages (temporary release preparation)
on:
  push:
    branches: [seo-search-foundations-2026-11]
    paths: ['scripts/build_seo.py', '.github/workflows/seo-generate-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-search-foundations-2026-11
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate accurate genre pages, robots and sitemap
        run: python scripts/build_seo.py
      - name: Commit generated public files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add genres/ sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate 8 verified-game category pages, robots and sitemap"
            git push origin HEAD:seo-search-foundations-2026-11
          fi
