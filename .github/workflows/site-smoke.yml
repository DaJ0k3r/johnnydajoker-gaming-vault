name: MADHOUSE Source Smoke Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check catalogue, saved-data contracts and page links
        run: python -m unittest discover -s scripts -p 'test_site_smoke.py' -v
