name: MADHOUSE Source Smoke Tests
on:
  push:
    branches:
      - main
      - phase-1-final-release-2026-11
  pull_request:
    branches:
      - main
      - phase-1-final-release-2026-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all GitHub Actions workflow YAML
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          for file in sorted(Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(file.read_text(encoding='utf-8'))
              print('PASS YAML', file)
          PY
      - name: Check inline JavaScript syntax
        run: python scripts/check_inline_js.py
      - name: Generate MADHOUSE 6 verification review report
        run: |
          python scripts/audit_madhouse6.py --output /tmp/madhouse-6-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/madhouse-6-audit.json').read_text())
          assert data['catalogueCount'] == sum(data['statusCounts'].values())
          assert isinstance(data['verificationReview'], list)
          print('PASS read-only verification audit')
          PY
      - name: Check catalogue, saved-data contracts and page links
        run: python -m unittest discover -s scripts -p 'test_site_smoke.py' -v
      - name: Verify generated first paint is up to date
        run: |
          python scripts/build_first_paint.py
          git diff --exit-code -- index.html
      - name: Validate generated SEO pages and sitemap
        run: |
          python scripts/build_seo.py
          python -m unittest discover -s scripts -p 'test_seo.py' -v
          git diff --exit-code -- sitemap.xml robots.txt genres/
      - name: Install real-browser QA
        run: python -m pip install 'playwright==1.55.0'
      - name: Desktop and mobile browser smoke tests
        run: python scripts/test_browser_e2e.py
      - name: Package isolated preview
        run: |
          mkdir -p preview
          cp index.html admin.html about.html privacy.html contact.html takedown.html robots.txt sitemap.xml preview/
          cp -R genres preview/genres
          cp -R data preview/data
          for dir in assets images img css js fonts; do
            if [ -d "$dir" ]; then cp -R "$dir" "preview/$dir"; fi
          done
          cp -R ./*.png ./*.jpg ./*.jpeg ./*.webp ./*.svg ./*.ico ./*.mp4 preview/ 2>/dev/null || true
      - name: Upload downloadable Phase 1 preview
        uses: actions/upload-artifact@v4
        with:
          name: madhouse-phase-1-preview
          path: preview/
          if-no-files-found: error
          retention-days: 14
