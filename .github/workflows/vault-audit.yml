name: Vault Link Health Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check game URLs and create issue report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/audit_links.py
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-link-audit
          path: |
            vault-audit-report.md
            vault-audit-results.json
          if-no-files-found: warn
          retention-days: 30
