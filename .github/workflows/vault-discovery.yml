name: MADHOUSE Universal Game Intake
on:
  push:
    branches: [main, vault-universal-intake-v2]
    paths: ['scripts/vault_*.py', 'scripts/test_vault_discovery.py', 'scripts/test_vault_intake.py', '.github/workflows/vault-discovery.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/vault_*.py', 'scripts/test_vault_discovery.py', 'scripts/test_vault_intake.py', '.github/workflows/vault-discovery.yml']
  schedule:
    # Every day approximately 07:23 Brisbane (21:23 UTC previous calendar day).
    - cron: '23 21 * * *'
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: vault-intake-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scan, intake and browser tools
        run: python -m py_compile scripts/vault_discovery.py scripts/vault_browser_probe.py scripts/vault_intake.py
      - name: Test deduplication and safe bulk intake
        run: |
          python -m unittest discover -s scripts -p 'test_vault_discovery.py' -v
          python -m unittest discover -s scripts -p 'test_vault_intake.py' -v

  discover:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == 'MADHOUSE: Run discovery now')
    runs-on: ubuntu-latest
    timeout-minutes: 26
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daily: discover up to 48 unique projects and sample 40 existing links
        run: python scripts/vault_discovery.py scan
      - name: Install browser automation (use runner Chrome as fallback)
        continue-on-error: true
        run: python -m pip install 'playwright==1.55.0'
      - name: Observe candidate and catalogue pages in headless browser
        run: python scripts/vault_browser_probe.py
      - name: Automatically stage ALL safe nonduplicate new candidates in a single PR
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          batch="$(TZ=Australia/Brisbane date +%G-W%V)"
          branch="vault-auto-$batch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
          else
            git checkout -B "$branch"
          fi

          python scripts/vault_intake.py
          if ! git diff --quiet -- data/discovery/candidates.json; then
            git add data/discovery/candidates.json
            git commit -m "Auto-stage all MADHOUSE leads from $batch (unverified only)"
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "STAGING_COMPARE_URL=https://github.com/$GH_REPO/compare/main...$branch?expand=1" >> "$GITHUB_ENV"
          existing="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            echo "STAGING_PR_URL=$existing" >> "$GITHUB_ENV"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if pr="$(gh pr create --base main --head "$branch" \
              --title "MADHOUSE $batch: automatic all-game discovery batch" \
              --body "All nonduplicate leads have been staged as UNVERIFIED only. No gameplay was automatically verified. This PR changes only the discovery queue, not the public game catalogue. Review and merge the WHOLE batch once; comment on any exceptions." 2>&1)"; then
              echo "STAGING_PR_URL=$pr" >> "$GITHUB_ENV"
            else
              echo "GitHub Actions could not create PR: $pr"
              echo "$pr" > reports/pr-creation-error.txt
            fi
          fi
      - name: Generate whole-batch review summary (no individual selections)
        run: python scripts/vault_discovery.py render
      - name: Upload complete discovery and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: vault-discovery-evidence
          path: reports/
          retention-days: 30
      - name: Notify owner with one batch review
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          title="$(head -n 1 reports/vault-approvals.md | sed 's/^# //')"
          existing="$(gh issue list --state all --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file reports/vault-approvals.md
          else
            gh issue create --title "$title" --body-file reports/vault-approvals.md --assignee "$OWNER"
          fi
      - name: Report outcome on manual run issue
        if: github.event_name == 'issues'
        env:
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import json
          d = json.load(open("reports/vault-intake-summary.json"))
          c = d["counts"]
          lines = ["MADHOUSE automatic all-game intake completed.", "",
                   f"Candidates found: {c['proposals']}; newly staged: {c['autoQueued']}; "
                   f"possible browser launches: {c['renderCandidate']}; further review: {c['needsInspection']}.",
                   "No game was marked verified or published.",
                   "",
                   "See the current weekly MADHOUSE Discovery approvals issue for the batch PR."]
          open("reports/scan-summary.md", "w").write("\n".join(lines) + "\n")
          PY
          gh issue comment "$TRIGGER_ISSUE" --body-file reports/scan-summary.md
          gh issue close "$TRIGGER_ISSUE" --reason completed
