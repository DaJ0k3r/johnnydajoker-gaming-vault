name: MADHOUSE Vault Discovery & Approvals
on:
  push:
    branches: [main, vault-automation-v1]
    paths: ['scripts/vault_*.py', 'scripts/test_vault_discovery.py', '.github/workflows/vault-discovery.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/vault_*.py', 'scripts/test_vault_discovery.py', '.github/workflows/vault-discovery.yml']
  schedule:
    # Monday 07:23 Brisbane (Sunday 21:23 UTC).
    - cron: '23 21 * * 0'
  workflow_dispatch:
  issues:
    types: [edited, opened]
permissions:
  contents: read
concurrency:
  group: vault-discovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-tests:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile discovery tools
        run: python -m py_compile scripts/vault_discovery.py scripts/vault_browser_probe.py
      - name: Test safe staging and deduplication
        run: python -m unittest discover -s scripts -p 'test_vault_discovery.py' -v
  discover:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
       github.actor == github.repository_owner &&
       github.event.issue.title == 'MADHOUSE: Run discovery now')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover non-duplicate projects and audit 12 existing links
        run: python scripts/vault_discovery.py scan
      - name: Install headless Chromium
        continue-on-error: true
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Observe actual browser rendering (not full gameplay)
        run: python scripts/vault_browser_probe.py
      - name: Write approval checklist with browser observations
        run: python scripts/vault_discovery.py render
      - name: Upload evidence and checklist for future review
        uses: actions/upload-artifact@v4
        with:
          name: vault-discovery-evidence
          path: reports/
          retention-days: 30
      - name: Open one approval issue per week; never auto-publish
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          title="$(head -n 1 reports/vault-approvals.md | sed 's/^# //')"
          if gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -Fqx "$title"; then
            echo "Approval issue for this week already exists; leaving checked decisions untouched."
          else
            gh issue create --title "$title" --body-file reports/vault-approvals.md --assignee "$OWNER"
          fi
  stage-approved-candidates:
    if: >-
      github.event_name == 'issues' &&
      github.actor == github.repository_owner &&
      startsWith(github.event.issue.title, 'MADHOUSE Discovery approvals')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process only owner-checked candidates
        run: |
          python -c 'import json,os; data=json.load(open(os.environ["GITHUB_EVENT_PATH"]));open("/tmp/vault-issue.md","w").write(data["issue"].get("body") or "")'
          python scripts/vault_discovery.py approve --body-file /tmp/vault-issue.md
      - name: Open safe staging PR (never changes public catalogue)
        run: |
          if git diff --quiet -- data/discovery/candidates.json; then
            echo "No new approved candidates. Nothing to stage."
            exit 0
          fi
          branch="vault-approved-issue-$ISSUE_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/discovery/candidates.json
          git commit -m "Stage owner-approved MADHOUSE game leads from issue #$ISSUE_NUMBER"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          if gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty' | grep -q '[0-9]'; then
            echo "Existing staging PR updated."
          else
            gh pr create --base main --head "$branch" \
              --title "Discovery: approved leads from issue #$ISSUE_NUMBER" \
              --body "Owner-approved candidates only. All remain UNVERIFIED in data/discovery/candidates.json; gameplay, rights and direct launch still require testing. This PR does not publish games or change the public catalogue. Source: #$ISSUE_NUMBER."
          fi
