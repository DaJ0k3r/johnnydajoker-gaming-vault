<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Neon Dodge | MADHOUSE Originals</title><style>*{box-sizing:border-box}body{margin:0;background:#050a07;color:#dfffe2;font:16px system-ui;text-align:center}header{padding:12px;color:#9cff80;font-weight:900;letter-spacing:2px}main{max-width:480px;margin:auto;padding:0 10px}canvas{display:block;width:100%;aspect-ratio:3/5;background:#0b1510;border:2px solid #487a4c;border-radius:14px;touch-action:none}button{padding:12px 20px;border:0;border-radius:9px;background:#91f674;color:#061509;font-weight:900;margin:10px}.hud{display:flex;justify-content:space-between;padding:8px}p{color:#a8c4ac;font-size:13px}</style></head><body><header>MADHOUSE ORIGINALS // NEON DODGE</header><main><div class="hud"><span id="score">SCORE 0</span><span id="best">BEST 0</span></div><canvas id="c" width="360" height="600" aria-label="Dodge falling obstacles"></canvas><button id="start">START / RESTART</button><p>Move with ← → or A/D on PC. Drag your finger on mobile. Dodge the red blocks and collect green orbs.</p><a href="../../" style="color:#9cff80">BACK TO THE VAULT</a></main><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let best=0;try{best=Number(localStorage.getItem('jdj-neon-dodge-best')||0)}catch{}bestEl.textContent='BEST '+best;let player=180,keys={},items=[],score=0,spawn=0,frame=0,running=false,last=0,raf=0;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function draw(){ctx.clearRect(0,0,360,600);ctx.fillStyle='#0a160e';ctx.fillRect(0,0,360,600);ctx.strokeStyle='#163b22';for(let x=30;x<360;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,600);ctx.stroke()}for(let y=(frame*3)%60;y<600;y+=60){ctx.fillStyle='#24462b';ctx.fillRect(0,y,360,2)}for(const o of items){ctx.fillStyle=o.good?'#a1ff7e':'#ff5368';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=13;ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h)}ctx.shadowBlur=15;ctx.shadowColor='#9aff83';ctx.fillStyle='#b3ff9e';ctx.beginPath();ctx.moveTo(player,520);ctx.lineTo(player-17,556);ctx.lineTo(player+17,556);ctx.closePath();ctx.fill();ctx.shadowBlur=0;if(!running){ctx.fillStyle='#e3ffe8';ctx.textAlign='center';ctx.font='bold 25px system-ui';ctx.fillText(frame?'GAME OVER':'NEON DODGE',180,255);ctx.font='15px system-ui';ctx.fillText('Press START to play',180,290)}}function end(){running=false;if(score>best){best=score;try{localStorage.setItem('jdj-neon-dodge-best',String(best))}catch{}}bestEl.textContent='BEST '+best;draw()}function loop(t){if(!running)return;const dt=Math.min(2,(t-last)/16.67||1);last=t;frame+=dt;if(keys.ArrowLeft||keys.a)player-=6*dt;if(keys.ArrowRight||keys.d)player+=6*dt;player=clamp(player,20,340);spawn+=dt;if(spawn>Math.max(11,33-score/12)){spawn=0;const good=Math.random()<.22;items.push({x:20+Math.random()*320,y:-25,w:good?16:25+Math.random()*28,h:good?16:25,good})}for(const o of items){o.y+=(3.6+score/110)*dt;if(Math.abs(o.x-player)<(o.w/2+12)&&Math.abs(o.y-538)<(o.h/2+17)){if(o.good){score+=20;o.y=999}else{end();return}}}items=items.filter(o=>o.y<630);score+=dt*.09;scoreEl.textContent='SCORE '+Math.floor(score);draw();raf=requestAnimationFrame(loop)}document.getElementById('start').onclick=()=>{cancelAnimationFrame(raf);player=180;items=[];score=0;spawn=0;frame=0;running=true;last=performance.now();raf=requestAnimationFrame(loop)};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false});function move(e){const r=c.getBoundingClientRect();player=clamp((e.clientX-r.left)/r.width*360,20,340)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});draw()})();</script></body></html>
