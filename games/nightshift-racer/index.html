<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTSHIFT RACER | MADHOUSE Originals</title><style>*{box-sizing:border-box}body{margin:0;background:#06070c;color:#e8ffe9;font-family:system-ui;text-align:center}header{padding:12px 5px;color:#9cff78;font-weight:900;letter-spacing:1.5px}main{max-width:480px;margin:auto;padding:0 10px}.hud{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:5px 0 8px}canvas{display:block;width:auto;max-width:100%;height:min(58dvh,580px);aspect-ratio:3/5;margin:auto;border:2px solid #5ea56b;border-radius:12px;background:#111;touch-action:none}button{background:#a5ff7c;color:#0b150c;border:0;border-radius:10px;padding:13px 18px;font-weight:900;font-size:16px}#start{display:block;width:100%;margin:6px 0 10px}.controls{display:flex;gap:12px;justify-content:center;margin:10px 0}.modes{display:flex;gap:8px;margin:8px 0}.modes button{flex:1;background:#1c3023;color:#c8efc9;border:1px solid #487b50}.modes button.active{background:#a5ff7c;color:#081208}#mission{padding:7px 10px;background:#122017;border:1px solid #34593c;border-radius:8px;font-size:13px;margin:7px 0}#status{font-size:13px;min-height:19px;color:#b8fbb7}.controls button{flex:1;max-width:180px;touch-action:none;user-select:none}p{color:#b3c8b8;font-size:13px}a{color:#a5ff7c}</style></head><body><header>MADHOUSE ORIGINALS // NIGHTSHIFT RACER</header><main><div class="hud"><span id="score">DISTANCE 0</span><span id="speed">SPEED 0</span><span id="best">BEST 0</span></div><div class="modes"><button id="arcade" class="active">♾ ARCADE</button><button id="career">🏁 CAREER</button></div><div id="mission">Arcade: dodge traffic and beat your personal best.</div><div id="status" role="status"></div><button id="start">START / RESTART</button><canvas id="c" width="360" height="600" aria-label="Nightshift Racer game"></canvas><div class="controls"><button id="left" aria-label="Steer left">◀ LEFT</button><button id="right" aria-label="Steer right">RIGHT ▶</button></div><p>Hold LEFT or RIGHT, drag on the road, or use A/D and arrow keys. Dodge traffic. Survive as the highway speeds up.</p><a href="../../">BACK TO THE VAULT</a></main><script>(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),S=document.getElementById('score'),V=document.getElementById('speed'),B=document.getElementById('best');let best=0;try{best=+(localStorage.getItem('jdj-nightshift-best')||0)}catch{}B.textContent='BEST '+best;let x=180,traffic=[],dist=0,frame=0,spawn=0,playing=false,raf=0,last=0,dir=0,drag=false,keys={},mode='arcade',level=1,unlocked=1,passes=0;const levels=[{name:'FIRST SHIFT',target:250,speed:1,passes:4,interval:31},{name:'CITY LIMITS',target:360,speed:2,passes:7,interval:27},{name:'NIGHT RUN',target:480,speed:3,passes:11,interval:24},{name:'HIGHWAY HEAT',target:580,speed:3.5,passes:14,interval:22},{name:'MIDNIGHT EXPRESS',target:720,speed:4,passes:19,interval:21},{name:'THE LONG HAUL',target:850,speed:4.5,passes:23,interval:20},{name:'RUSH HOUR',target:950,speed:5,passes:28,interval:19},{name:'REDLINE',target:1050,speed:5.5,passes:32,interval:18},{name:'DARK STREETS',target:1150,speed:6,passes:38,interval:17},{name:'NARROW ESCAPE',target:1250,speed:6.5,passes:43,interval:16},{name:'FULL THROTTLE',target:1350,speed:7,passes:48,interval:16},{name:'NO BRAKES',target:1450,speed:7.5,passes:53,interval:15},{name:'GHOST HIGHWAY',target:1550,speed:8,passes:59,interval:15},{name:'DEAD OF NIGHT',target:1650,speed:8.5,passes:64,interval:14},{name:'STREET LEGEND',target:1750,speed:9,passes:70,interval:14},{name:'BLACKOUT',target:1900,speed:9.5,passes:77,interval:13},{name:'FINAL PURSUIT',target:2100,speed:10,passes:85,interval:13},{name:'NIGHTSHIFT KING',target:2400,speed:11,passes:100,interval:12}];try{unlocked=Math.max(1,Math.min(levels.length,Number(localStorage.getItem('jdj-nightshift-level')||1)||1))}catch{}level=unlocked;const mission=document.getElementById('mission'),status=document.getElementById('status');function missionText(){mission.textContent=mode==='arcade'?'ARCADE • Endless traffic • Beat your best distance':('CAREER • Level '+level+'/'+levels.length+' • '+levels[level-1].name+' • Reach '+levels[level-1].target+'m AND pass '+levels[level-1].passes+' cars without crashing • Passed '+passes);document.getElementById('arcade').classList.toggle('active',mode==='arcade');document.getElementById('career').classList.toggle('active',mode==='career');document.getElementById('start').textContent=mode==='career'?'START LEVEL '+level:'START / RESTART'}function setMode(next){if(playing)stop(false);mode=next;status.textContent='';missionText();draw()}document.getElementById('arcade').onclick=()=>setMode('arcade');document.getElementById('career').onclick=()=>setMode('career');const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function car(cx,cy,color,player=false){g.save();g.translate(cx,cy);g.shadowBlur=player?16:7;g.shadowColor=color;g.fillStyle=color;g.fillRect(-17,-30,34,60);g.fillStyle='#12202a';g.fillRect(-12,-16,24,24);g.fillStyle=player?'#e6ffe6':'#ffefb2';g.fillRect(-14,-29,9,5);g.fillRect(5,-29,9,5);g.fillStyle='#ff425c';g.fillRect(-14,23,9,5);g.fillRect(5,23,9,5);g.restore()}function draw(){g.fillStyle='#070e13';g.fillRect(0,0,360,600);g.fillStyle='#18222a';g.fillRect(42,0,276,600);g.fillStyle='#4f6672';g.fillRect(42,0,4,600);g.fillRect(314,0,4,600);for(let lane=1;lane<3;lane++){const lx=42+276*lane/3;g.fillStyle='#d9d9b5';for(let y=((frame*8)%90)-90;y<600;y+=90)g.fillRect(lx-2,y,4,42)}for(let y=(frame*8)%75;y<600;y+=75){g.fillStyle='#2bda79';g.fillRect(16,y,8,24);g.fillRect(336,y,8,24)}traffic.forEach(t=>car(t.x,t.y,t.color));car(x,515,'#a4ff78',true);if(!playing){g.fillStyle='#e4ffe9';g.textAlign='center';g.font='bold 27px system-ui';g.fillText(status.textContent.startsWith('LEVEL')?'LEVEL COMPLETE!':(status.textContent.startsWith('CRASH')||status.textContent.startsWith('RUN OVER')?'CRASH!':'NIGHTSHIFT RACER'),180,250);g.font='15px system-ui';g.fillText('Tap START above to drive',180,284)}}function stop(won=false){playing=false;const d=Math.floor(dist);if(mode==='arcade'&&d>best){best=d;try{localStorage.setItem('jdj-nightshift-best',String(best))}catch{}}B.textContent='BEST '+best;if(mode==='career'){if(won){status.textContent='LEVEL '+level+' COMPLETE! '+(level<levels.length?'Next level unlocked.':'ALL LEVELS COMPLETE!');if(level<levels.length){level++;unlocked=Math.max(unlocked,level);try{localStorage.setItem('jdj-nightshift-level',String(unlocked))}catch{}}}else{status.textContent='CRASH! Try level '+level+' again.'}missionText()}else status.textContent='RUN OVER • '+d+'m. Try to beat your record!';draw()}function tick(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67||1);last=t;frame+=dt;const speed=5+Math.min(10,dist/170)+(mode==='career'?levels[level-1].speed:0);let move=dir+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);x=clamp(x+move*6.3*dt,65,295);spawn+=dt;if(spawn>(mode==='career'?Math.max(10,levels[level-1].interval-dist/600):Math.max(17,49-dist/75))){spawn=0;const lanes=[88,180,272];const lane=lanes[Math.floor(Math.random()*3)];traffic.push({x:lane,y:-45,color:['#ff5d83','#4dc9ff','#ffb957'][Math.floor(Math.random()*3)]})}for(const a of traffic){a.y+=speed*dt;if(Math.abs(a.x-x)<31&&Math.abs(a.y-515)<51){stop(false);return}}traffic=traffic.filter(a=>{if(a.y>=580){if(mode==='career')passes++;return false}return true});dist+=speed*dt/12;if(mode==='career'&&dist>=levels[level-1].target&&passes>=levels[level-1].passes){S.textContent='DISTANCE '+Math.floor(dist);stop(true);return}S.textContent='DISTANCE '+Math.floor(dist);if(mode==='career')missionText();V.textContent='SPEED '+Math.round(70+speed*12);draw();raf=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(raf);x=180;traffic=[];dist=0;frame=0;spawn=0;dir=0;passes=0;status.textContent='';missionText();playing=true;last=performance.now();raf=requestAnimationFrame(tick)}document.getElementById('start').addEventListener('click',start);function steer(id,v){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);dir=v});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(dir===v)dir=0})}steer('left',-1);steer('right',1);addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false});c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);position(e)});c.addEventListener('pointermove',e=>{if(drag)position(e)});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);function position(e){const r=c.getBoundingClientRect();x=clamp((e.clientX-r.left)/r.width*360,65,295)}missionText();draw()})();</script></body></html>
