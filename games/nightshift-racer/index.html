<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTSHIFT RACER | MADHOUSE Originals</title><style>*{box-sizing:border-box}body{margin:0;background:#06070c;color:#e8ffe9;font-family:system-ui;text-align:center}header{padding:12px 5px;color:#9cff78;font-weight:900;letter-spacing:1.5px}main{max-width:480px;margin:auto;padding:0 10px}.hud{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin:5px 0 8px}canvas{display:block;width:auto;max-width:100%;height:min(58dvh,580px);aspect-ratio:3/5;margin:auto;border:2px solid #5ea56b;border-radius:12px;background:#111;touch-action:none}button{background:#a5ff7c;color:#0b150c;border:0;border-radius:10px;padding:13px 18px;font-weight:900;font-size:16px}#start{display:block;width:100%;margin:6px 0 10px}.controls{display:flex;gap:12px;justify-content:center;margin:10px 0}.controls button{flex:1;max-width:180px;touch-action:none;user-select:none}p{color:#b3c8b8;font-size:13px}a{color:#a5ff7c}</style></head><body><header>MADHOUSE ORIGINALS // NIGHTSHIFT RACER</header><main><div class="hud"><span id="score">DISTANCE 0</span><span id="speed">SPEED 0</span><span id="best">BEST 0</span></div><button id="start">START / RESTART</button><canvas id="c" width="360" height="600" aria-label="Nightshift Racer game"></canvas><div class="controls"><button id="left" aria-label="Steer left">◀ LEFT</button><button id="right" aria-label="Steer right">RIGHT ▶</button></div><p>Hold LEFT or RIGHT, drag on the road, or use A/D and arrow keys. Dodge traffic. Survive as the highway speeds up.</p><a href="../../">BACK TO THE VAULT</a></main><script>(()=>{'use strict';const c=document.getElementById('c'),g=c.getContext('2d'),S=document.getElementById('score'),V=document.getElementById('speed'),B=document.getElementById('best');let best=0;try{best=+(localStorage.getItem('jdj-nightshift-best')||0)}catch{}B.textContent='BEST '+best;let x=180,traffic=[],dist=0,frame=0,spawn=0,playing=false,raf=0,last=0,dir=0,drag=false,keys={};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function car(cx,cy,color,player=false){g.save();g.translate(cx,cy);g.shadowBlur=player?16:7;g.shadowColor=color;g.fillStyle=color;g.fillRect(-17,-30,34,60);g.fillStyle='#12202a';g.fillRect(-12,-16,24,24);g.fillStyle=player?'#e6ffe6':'#ffefb2';g.fillRect(-14,-29,9,5);g.fillRect(5,-29,9,5);g.fillStyle='#ff425c';g.fillRect(-14,23,9,5);g.fillRect(5,23,9,5);g.restore()}function draw(){g.fillStyle='#070e13';g.fillRect(0,0,360,600);g.fillStyle='#18222a';g.fillRect(42,0,276,600);g.fillStyle='#4f6672';g.fillRect(42,0,4,600);g.fillRect(314,0,4,600);for(let lane=1;lane<3;lane++){const lx=42+276*lane/3;g.fillStyle='#d9d9b5';for(let y=((frame*8)%90)-90;y<600;y+=90)g.fillRect(lx-2,y,4,42)}for(let y=(frame*8)%75;y<600;y+=75){g.fillStyle='#2bda79';g.fillRect(16,y,8,24);g.fillRect(336,y,8,24)}traffic.forEach(t=>car(t.x,t.y,t.color));car(x,515,'#a4ff78',true);if(!playing){g.fillStyle='#e4ffe9';g.textAlign='center';g.font='bold 27px system-ui';g.fillText(frame?'CRASH!':'NIGHTSHIFT RACER',180,250);g.font='15px system-ui';g.fillText('Tap START above to drive',180,284)}}function stop(){playing=false;const d=Math.floor(dist);if(d>best){best=d;try{localStorage.setItem('jdj-nightshift-best',String(best))}catch{}}B.textContent='BEST '+best;draw()}function tick(t){if(!playing)return;const dt=Math.min(2,(t-last)/16.67||1);last=t;frame+=dt;const speed=5+Math.min(10,dist/170);let move=dir+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);x=clamp(x+move*6.3*dt,65,295);spawn+=dt;if(spawn>Math.max(17,49-dist/75)){spawn=0;const lanes=[88,180,272];const lane=lanes[Math.floor(Math.random()*3)];traffic.push({x:lane,y:-45,color:['#ff5d83','#4dc9ff','#ffb957'][Math.floor(Math.random()*3)]})}for(const a of traffic){a.y+=speed*dt;if(Math.abs(a.x-x)<31&&Math.abs(a.y-515)<51){stop();return}}traffic=traffic.filter(a=>a.y<660);dist+=speed*dt/12;S.textContent='DISTANCE '+Math.floor(dist);V.textContent='SPEED '+Math.round(70+speed*12);draw();raf=requestAnimationFrame(tick)}function start(){cancelAnimationFrame(raf);x=180;traffic=[];dist=0;frame=0;spawn=0;dir=0;playing=true;last=performance.now();raf=requestAnimationFrame(tick)}document.getElementById('start').addEventListener('click',start);function steer(id,v){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);dir=v});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(dir===v)dir=0})}steer('left',-1);steer('right',1);addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key)){keys[e.key]=true;e.preventDefault()}});addEventListener('keyup',e=>{keys[e.key]=false});c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);position(e)});c.addEventListener('pointermove',e=>{if(drag)position(e)});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);function position(e){const r=c.getBoundingClientRect();x=clamp((e.clientX-r.left)/r.width*360,65,295)}draw()})();</script></body></html>
